<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanceur de dés · Armonia</title>
<style>
 :root{--bg:#1a1a2e;--paper:#2a2a3e;--primary:#c9a85a;--accent:#d97c47;--text:#f4e8d0;--muted:#9a8a7a;--danger:#c44040;--success:#5aa850;--crystal:#7ec8e8;--border:#3a3a4e}
 *{box-sizing:border-box} body{font-family:Georgia,serif;background:var(--bg);color:var(--text);margin:0;padding:20px;line-height:1.5}
 .wrap{max-width:560px;margin:0 auto}
 a.back{color:var(--muted);text-decoration:none;font-size:14px} a.back:hover{color:var(--primary)}
 h1{font-size:26px;color:var(--primary);margin:12px 0 2px;text-align:center}
 .sub{color:var(--muted);font-style:italic;text-align:center;margin:0 0 16px;font-size:13px}
 .stage{background:radial-gradient(circle at 50% 42%,#26263e,#16162a);border:1px solid var(--border);border-radius:16px;padding:34px 18px 26px;text-align:center;position:relative;overflow:hidden;min-height:300px}
 .die{width:170px;height:170px;margin:0 auto 6px;position:relative;display:flex;align-items:center;justify-content:center;
      background:linear-gradient(145deg,#3a3a58,#22223a);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);
      box-shadow:0 8px 24px #0009, inset 0 2px 8px #ffffff22;transition:transform .2s}
 .die .num{font-size:76px;font-weight:bold;color:var(--primary);text-shadow:0 2px 6px #000a}
 .die.rolling{animation:tumble .12s linear infinite}
 @keyframes tumble{0%{transform:rotate(-8deg) scale(1.02)}50%{transform:rotate(8deg) scale(.98)}100%{transform:rotate(-8deg) scale(1.02)}}
 .die.settle{animation:pop .4s ease}
 @keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
 /* d20 qui brûle sur un échec critique */
 .die.crit-burn{background:linear-gradient(160deg,#5a1400,#2a0a00);box-shadow:0 0 30px #ff5a00aa, inset 0 2px 8px #ff900055}
 .die.crit-burn .num{background:linear-gradient(0deg,#ff3000,#ff9000 45%,#ffd000 75%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px #ff5a00cc}
 /* d20 qui s'illumine sur une réussite critique */
 .die.crit-glow{background:linear-gradient(160deg,#4a3a12,#2a2208);box-shadow:0 0 34px #ffcf5aaa, inset 0 2px 10px #ffe89a66}
 .die.crit-glow .num{color:#fff6d8;text-shadow:0 0 10px #ffe89a,0 0 26px #ffcf5a,0 0 46px #ffb000}
 .verdict{font-size:26px;font-weight:bold;letter-spacing:1px;margin:12px 0 0;min-height:32px}
 .burn{background:linear-gradient(0deg,#ff3000,#ff9000 40%,#ffd000 70%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
       animation:flicker .12s infinite alternate, rise 1.2s ease both;text-shadow:0 0 18px #ff5a00cc}
 @keyframes flicker{from{filter:brightness(1)}to{filter:brightness(1.45)}}
 @keyframes rise{0%{opacity:0;transform:translateY(14px) scale(.9)}30%{opacity:1}100%{transform:none}}
 .glow{color:#fff6d8;text-shadow:0 0 8px #ffe89a,0 0 22px #ffcf5a,0 0 40px #ffb000;animation:shine 1.4s ease both}
 @keyframes shine{0%{opacity:0;transform:scale(.85)}50%{text-shadow:0 0 14px #fff,0 0 44px #ffcf5a,0 0 70px #ffb000}100%{opacity:1;transform:scale(1)}}
 .ember{position:absolute;bottom:40%;width:6px;height:6px;border-radius:50%;background:radial-gradient(#ffd000,#ff5a00);pointer-events:none;opacity:0}
 .ember.go{animation:ember 1.1s ease-out forwards}
 @keyframes ember{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-140px) translateX(var(--dx,0)) scale(.3)}}
 .halo{position:absolute;left:50%;top:40%;width:10px;height:10px;transform:translate(-50%,-50%);border-radius:50%;opacity:0}
 .halo.go{animation:halo 1s ease-out forwards}
 @keyframes halo{0%{opacity:.9;box-shadow:0 0 0 0 #ffcf5aaa}100%{opacity:0;box-shadow:0 0 0 240px #ffcf5a00}}
 .rollbtn{width:100%;margin-top:16px;background:linear-gradient(145deg,#8a3010,#c05018);border:1px solid #a85a30;color:#ffe6cf;border-radius:10px;padding:16px;font:inherit;font-size:19px;font-weight:bold;cursor:pointer;letter-spacing:1px}
 .rollbtn:hover{filter:brightness(1.12)} .rollbtn:active{transform:translateY(1px)}
 .note{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
 .foot{text-align:center;color:var(--muted);font-size:11px;margin:18px 0 4px}
</style>
<link rel="stylesheet" href="theme.css"><script>document.documentElement.dataset.theme=(function(){try{return localStorage.getItem("armonia_theme")}catch(e){return null}})()||"dark";</script><script src="theme.js" defer></script></head>
<body><div class="wrap">
<a class="back" href="index.html">← Retour au sommaire</a>
<h1>🎲 Lanceur de dés</h1>
<p class="sub">Un d20 brut — le 1 brûle 🔥, le 20 s'illumine ✨</p>

<div class="stage" id="stage">
  <div class="die" id="die"><span class="num" id="dieNum">?</span></div>
  <div class="verdict" id="verdict"></div>
</div>

<button class="rollbtn" id="rollbtn" onclick="doRoll()">LANCER LE DÉ</button>
<div class="note">Clique ou appuie sur <b>Entrée</b> pour relancer. Le total, tu l'ajoutes toi-même.</div>

<p class="foot">Lanceur de dés · Système Bilal · Armonia 2026</p>
</div>

<script>
const $=id=>document.getElementById(id);
let rolling=false;
function doRoll(){
  if(rolling)return; rolling=true;
  const die=$('die'), num=$('dieNum'), verdict=$('verdict');
  verdict.className='verdict'; verdict.textContent='';
  die.className='die rolling';
  [...document.querySelectorAll('.ember,.halo')].forEach(e=>e.remove());
  const cyc=setInterval(()=>{ num.textContent=1+Math.floor(Math.random()*20); },70);
  setTimeout(()=>{
    clearInterval(cyc);
    const r=1+Math.floor(Math.random()*20);
    num.textContent=r;
    die.className='die settle';
    if(r===1){ die.classList.add('crit-burn'); verdict.className='verdict burn'; verdict.textContent='ÉCHEC CRITIQUE'; burn(); }
    else if(r===20){ die.classList.add('crit-glow'); verdict.className='verdict glow'; verdict.textContent='RÉUSSITE CRITIQUE'; glow(); }
    rolling=false;
  }, 850);
}
function burn(){
  const stage=$('stage');
  for(let i=0;i<14;i++){
    const e=document.createElement('div'); e.className='ember';
    e.style.left=(38+Math.random()*24)+'%';
    e.style.setProperty('--dx',(Math.random()*60-30)+'px');
    e.style.animationDelay=(Math.random()*0.3)+'s';
    stage.appendChild(e); requestAnimationFrame(()=>e.classList.add('go'));
    setTimeout(()=>e.remove(),1500);
  }
}
function glow(){
  const stage=$('stage'); const h=document.createElement('div'); h.className='halo';
  stage.appendChild(h); requestAnimationFrame(()=>h.classList.add('go'));
  setTimeout(()=>h.remove(),1200);
}
document.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();doRoll();} });
</script>
</body></html>
