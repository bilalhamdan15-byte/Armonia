<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bibliothèque des Lieux — Armonia</title>
<style>
:root {
  --bg: #f5ebd6;
  --paper: #fffaf0;
  --primary: #2E5B7C;
  --accent: #a87830;
  --text: #3a2818;
  --muted: #8a7a5a;
  --border: #c9b896;
  --danger: #a02020;
}
* { box-sizing: border-box; }
body {
  font-family: 'Georgia', serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 16px;
}
.container { max-width: 1200px; margin: 0 auto; }
header.title-bar {
  text-align: center;
  margin-bottom: 20px;
  padding: 20px;
  background: var(--paper);
  border: 2px solid var(--accent);
  border-radius: 8px;
}
header.title-bar h1 {
  margin: 0;
  font-size: 30px;
  color: var(--primary);
  letter-spacing: 3px;
}
header.title-bar .subtitle {
  font-style: italic;
  color: var(--muted);
  margin-top: 8px;
}
.intro-box {
  background: var(--paper);
  border-left: 4px solid var(--primary);
  padding: 14px 18px;
  border-radius: 4px;
  margin-bottom: 20px;
}
.intro-box p { margin: 6px 0; font-size: 14px; }
.search-bar { margin-bottom: 12px; }
.search-bar input {
  width: 100%;
  padding: 10px 14px;
  background: var(--paper);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
}
.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  justify-content: center;
}
.filter-btn {
  background: var(--paper);
  color: var(--primary);
  border: 1px solid var(--accent);
  padding: 8px 14px;
  border-radius: 18px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
}
.filter-btn.active {
  background: var(--primary);
  color: white;
}
.places-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 14px;
}
.place-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}
.place-card.region-lumini { border-left: 4px solid #7a9a4a; }
.place-card.region-solambaire { border-left: 4px solid #c4a040; }
.place-card.region-noord { border-left: 4px solid #5a8eaa; }
.place-card.region-virtus { border-left: 4px solid #a04040; }
.place-card.region-armonia { border-left: 4px solid #c060a0; }
.place-card.region-heledera { border-left: 4px solid #c47a40; }
.place-card.region-other { border-left: 4px solid #8a7a5a; }
.place-card h2 {
  margin: 0 0 4px 0;
  color: var(--primary);
  font-size: 19px;
}
.place-cat {
  color: var(--accent);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}
.place-region {
  font-size: 11px;
  background: var(--accent);
  color: white;
  padding: 2px 8px;
  border-radius: 10px;
  display: inline-block;
  margin-bottom: 8px;
}
.place-desc {
  font-size: 13px;
  margin: 8px 0;
  line-height: 1.5;
  font-style: italic;
  color: #4a3825;
}
.place-card h3 {
  color: var(--accent);
  font-size: 12px;
  margin: 10px 0 4px 0;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 3px;
}
.facts-list {
  font-size: 13px;
  line-height: 1.6;
  padding-left: 0;
  list-style: none;
  margin: 0;
}
.facts-list li::before {
  content: "▸ ";
  color: var(--accent);
  font-weight: bold;
}
</style>
</head>
<body>
<div class="container">

<header class="title-bar">
  <h1>🗺️ BIBLIOTHÈQUE DES LIEUX</h1>
  <div class="subtitle">Univers d'Armonia — Cités, sanctuaires, ruines</div>
</header>

<div class="intro-box">
  <p><strong>Comment lire :</strong> chaque carte décrit un lieu canonique d'Armonia avec sa région, sa fonction, et ce que les joueurs y trouvent.</p>
  <p>🎲 Pour inventer un nouveau lieu, utilise le <a href="generateur_noms.html" style="color:var(--primary);font-weight:bold;">Générateur de noms</a>.</p>
</div>

<div class="search-bar">
  <input type="text" id="search" placeholder="🔍 Rechercher (nom, région, type...)" oninput="renderPlaces()">
</div>

<div class="filters">
  <button class="filter-btn active" onclick="filter('all')">Tout</button>
  <button class="filter-btn" onclick="filter('lumini')">🌳 Lumini</button>
  <button class="filter-btn" onclick="filter('solambaire')">🌅 Sol'Ambaïre</button>
  <button class="filter-btn" onclick="filter('noord')">❄️ No'Ord</button>
  <button class="filter-btn" onclick="filter('virtus')">⚔ Virtus</button>
  <button class="filter-btn" onclick="filter('armonia')">👑 Armonia</button>
  <button class="filter-btn" onclick="filter('heledera')">🏝️ Heledera</button>
  <button class="filter-btn" onclick="filter('other')">🌍 Autres</button>
</div>

<div class="places-grid" id="places"></div>

</div>

function renderPlaces() {
  const grid = document.getElementById('places');
  const filter = window.currentFilter || 'all';
  const search = (document.getElementById('search').value || '').toLowerCase();
  grid.innerHTML = '';

  const filtered = PLACES.filter(p => {
    const matchCat = filter === 'all' || p.region === filter;
    const matchSearch = !search ||
      p.nom.toLowerCase().includes(search) ||
      p.desc.toLowerCase().includes(search) ||
      p.cat.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  const regionLabels = {
    lumini: '🌳 Lumini', solambaire: "🌅 Sol'Ambaïre", noord: "❄️ No'Ord",
    virtus: '⚔ Virtus', armonia: '👑 Armonia', heledera: '🏝️ Heledera', other: '🌍 Autre'
  };

  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'place-card region-' + p.region;
    card.innerHTML = `
      <div class="place-cat">${p.cat}</div>
      <h2>${p.nom}</h2>
      <span class="place-region">${regionLabels[p.region]}</span>
      <div class="place-desc">${p.desc}</div>
      <h3>Caractéristiques</h3>
      <ul class="facts-list">${p.facts.map(f => `<li>${f}</li>`).join('')}</ul>
    `;
    grid.appendChild(card);
  });
}

function filter(reg) {
  window.currentFilter = reg;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderPlaces();
}

window.currentFilter = 'all';
