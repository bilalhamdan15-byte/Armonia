<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Armonia ProcGen</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: var(--ts-background-primary, #111827);
  color: var(--ts-color-primary, #e5e7eb);
  height: 100vh; display: flex; flex-direction: column; overflow: hidden; font-size: 13px;
}
.header { padding: 10px 14px; background: var(--ts-background-secondary, #1f2937); border-bottom: 1px solid #374151; }
.header-title { font-weight: 700; font-size: 14px; color: var(--ts-accent-primary, #f59e0b); }
.header-sub { font-size: 10px; color: #9ca3af; }
.tabs { display: flex; background: #1f2937; border-bottom: 1px solid #374151; }
.tab { flex: 1; padding: 8px 4px; text-align: center; cursor: pointer; font-size: 12px; font-weight: 500; border: none; background: none; color: #9ca3af; border-bottom: 2px solid transparent; }
.tab.active { color: #e5e7eb; border-bottom-color: #f59e0b; }
.content { flex: 1; overflow-y: auto; padding: 12px; }
.panel { display: none; }
.panel.active { display: block; }
.field { margin-bottom: 10px; }
.field label { display: block; font-size: 10px; font-weight: 600; text-transform: uppercase; color: #9ca3af; margin-bottom: 4px; }
select, input, textarea { width: 100%; padding: 7px 10px; background: #1f2937; border: 1px solid #374151; color: #e5e7eb; border-radius: 6px; font-size: 13px; outline: none; }
textarea { height: 72px; resize: none; font-family: monospace; font-size: 10px; }
.row { display: flex; gap: 8px; }
.row .field { flex: 1; }
.btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; background: #374151; color: #e5e7eb; }
.btn:hover { background: #4b5563; }
.btn-primary { background: #f59e0b; color: #111; width: 100%; padding: 10px; font-size: 14px; margin-top: 10px; border-radius: 8px; }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-danger { background: #dc2626; color: #fff; padding: 3px 8px; font-size: 11px; }
.btn-sm { padding: 4px 10px; font-size: 12px; font-weight: 700; min-width: 28px; }
.building-item { display: flex; align-items: center; padding: 7px 10px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; margin-bottom: 5px; }
.building-emoji { font-size: 16px; margin-right: 8px; }
.building-info { flex: 1; min-width: 0; }
.building-name { font-weight: 600; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.building-size { font-size: 10px; color: #9ca3af; }
.counter { display: flex; align-items: center; gap: 6px; margin-left: 8px; }
.counter-val { min-width: 22px; text-align: center; font-weight: 700; font-size: 14px; }
.lib-item { padding: 9px 10px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; margin-bottom: 6px; }
.lib-header { display: flex; justify-content: space-between; align-items: center; }
.lib-name { font-weight: 600; }
.lib-meta { font-size: 10px; color: #9ca3af; margin-top: 2px; }
.status { padding: 9px 12px; border-radius: 6px; font-size: 12px; margin-top: 8px; background: #1f2937; border-left: 3px solid #374151; display: none; line-height: 1.6; white-space: pre-wrap; }
.status.info    { border-left-color: #f59e0b; }
.status.success { border-left-color: #10b981; }
.status.error   { border-left-color: #dc2626; }
hr { border: none; border-top: 1px solid #374151; margin: 12px 0; }
.section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; color: #9ca3af; margin-bottom: 8px; }
.empty { text-align: center; color: #9ca3af; font-size: 12px; padding: 20px 0; }
.hint { font-size: 10px; color: #9ca3af; margin-top: 4px; font-style: italic; }
.step-btn { width: 100%; margin-top: 6px; }
.step { background: #1f2937; border: 1px solid #374151; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 12px; }
.step-title { font-weight: 600; margin-bottom: 4px; }
.step-sub { color: #9ca3af; font-size: 10px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-title">⚔️ Armonia ProcGen</div>
  <div class="header-sub">Générateur de maps procédurales</div>
</div>

<div class="tabs">
  <button class="tab active" id="tab-gen" onclick="switchTab('gen')">🗺️ Générer</button>
  <button class="tab" id="tab-lib" onclick="switchTab('lib')">📚 Bibliothèque</button>
</div>

<div class="content">

  <!-- ═══ GÉNÉRER ═══ -->
  <div class="panel active" id="panel-gen">
    <div class="field">
      <label>Taille de la map</label>
      <select id="map-size">
        <option value="20x20">Petite — 20×20</option>
        <option value="32x32" selected>Moyenne — 32×32</option>
        <option value="48x48">Grande — 48×48</option>
        <option value="64x64">XL — 64×64</option>
      </select>
    </div>
    <div class="field">
      <label>Sol</label>
      <select id="map-ground">
        <option value="herbe">🌿 Herbe (Moorgoth Floor)</option>
        <option value="pierre">🪨 Pierre médiévale</option>
        <option value="caverne">🕳️ Roche de caverne</option>
        <option value="bois">🪵 Planches de taverne</option>
      </select>
    </div>
    <div class="field">
      <label>Graine aléatoire (optionnel)</label>
      <input type="number" id="map-seed" placeholder="Vide = aléatoire">
    </div>
    <hr>
    <div class="section-label">Bâtiments à placer</div>
    <div id="building-pickers"><div class="empty">Ajoute des slabs dans 📚 Bibliothèque.</div></div>
    <button class="btn btn-primary" id="btn-gen" onclick="startGenerate()">⚡ Générer la map</button>
    <div class="status" id="gen-status"></div>

    <!-- Étapes de collage si buildings séparés -->
    <div id="paste-steps" style="display:none; margin-top:12px;">
      <div class="section-label">📋 Étapes de collage</div>
      <div id="steps-list"></div>
    </div>
  </div>

  <!-- ═══ BIBLIOTHÈQUE ═══ -->
  <div class="panel" id="panel-lib">
    <div class="section-label">Slabs enregistrés</div>
    <div id="lib-list"><div class="empty">Aucun slab.</div></div>
    <hr>
    <div class="section-label">Ajouter un slab</div>
    <div class="field"><label>Nom</label><input type="text" id="add-name" placeholder="Ex: Cat and Mutton"></div>
    <div class="field">
      <label>Type</label>
      <select id="add-type">
        <option value="maison">🏠 Maison</option>
        <option value="taverne">🍺 Taverne / Auberge</option>
        <option value="forge">⚒️ Forge</option>
        <option value="marche">🛒 Marché</option>
        <option value="tour">🗼 Tour / Fort</option>
        <option value="donjon">⚔️ Donjon</option>
        <option value="autre">📦 Autre</option>
      </select>
    </div>
    <div class="row">
      <div class="field"><label>Largeur (tiles)</label><input type="number" id="add-w" value="8" min="1" max="100"></div>
      <div class="field"><label>Profondeur (tiles)</label><input type="number" id="add-d" value="8" min="1" max="100"></div>
    </div>
    <p class="hint">Compte les cases dans TaleSpire.</p>
    <div class="field" style="margin-top:8px">
      <label>Code slab (Ctrl+C dans TaleSpire en mode construction)</label>
      <textarea id="add-code" placeholder="H4sIAAAAAAAA…"></textarea>
    </div>
    <button class="btn" style="width:100%;margin-top:4px" onclick="addSlab()">➕ Ajouter</button>
    <div class="status" id="lib-status"></div>
  </div>

</div>

<script>
'use strict';

const GROUND = {
  herbe:   { guid:'ee0d3511-24a3-4f6b-995d-3e54de38de3b', pathGuid:'5e38122e-f09c-47aa-8cb0-d9e122a894e9' },
  pierre:  { guid:'6f3d2d32-f1bb-429b-b50b-2dc8d235f2d8', pathGuid:'5e38122e-f09c-47aa-8cb0-d9e122a894e9' },
  caverne: { guid:'b83392b1-8833-43c9-a97f-2ac3df659e66', pathGuid:'ce6a2235-664f-43e8-a744-d5743623701d' },
  bois:    { guid:'cf6063bb-5c6e-4107-b3e9-9c0c5ac75768', pathGuid:null },
};
const EMOJI = { maison:'🏠', taverne:'🍺', forge:'⚒️', marche:'🛒', tour:'🗼', donjon:'⚔️', autre:'📦' };

let library = [], counts = {};
let pendingSlabs = []; // bâtiments à envoyer séparément

function switchTab(n) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
  document.getElementById('panel-'+n).classList.add('active');
}
function setStatus(id,msg,type='info'){
  const el=document.getElementById(id);
  el.style.display='block'; el.textContent=msg; el.className='status '+type;
}

// UUID → bytes_le
function guidToBytes(g) {
  const h=g.replace(/-/g,''), b=new Uint8Array(16);
  b[0]=parseInt(h.slice(6,8),16); b[1]=parseInt(h.slice(4,6),16);
  b[2]=parseInt(h.slice(2,4),16); b[3]=parseInt(h.slice(0,2),16);
  b[4]=parseInt(h.slice(10,12),16); b[5]=parseInt(h.slice(8,10),16);
  b[6]=parseInt(h.slice(14,16),16); b[7]=parseInt(h.slice(12,14),16);
  for(let i=0;i<8;i++) b[8+i]=parseInt(h.slice(16+i*2,18+i*2),16);
  return b;
}
function bytesToGuid(b) {
  const x=v=>v.toString(16).padStart(2,'0');
  return [b[3],b[2],b[1],b[0]].map(x).join('')+'-'+[b[5],b[4]].map(x).join('')+'-'+
         [b[7],b[6]].map(x).join('')+'-'+[b[8],b[9]].map(x).join('')+'-'+
         Array.from(b.slice(10)).map(x).join('');
}

// Build slab binary
function buildBinary(placements) {
  const map=new Map();
  for(const p of placements){ if(!map.has(p.guid))map.set(p.guid,[]); map.get(p.guid).push(p); }
  const entries=[...map.entries()];
  const buf=new ArrayBuffer(10+entries.length*20+placements.length*8);
  const v=new DataView(buf);
  v.setUint32(0,0xD1CEFACE,true); v.setUint16(4,2,true);
  v.setUint16(6,entries.length,true); v.setUint16(8,0,true);
  let lo=10;
  for(const[guid,inst]of entries){
    const ub=guidToBytes(guid); for(let i=0;i<16;i++)v.setUint8(lo+i,ub[i]);
    v.setUint16(lo+16,inst.length,true); v.setUint16(lo+18,0,true); lo+=20;
  }
  let ao=10+entries.length*20;
  for(const[,inst]of entries){
    for(const p of inst){
      const sx=BigInt(Math.max(0,Math.round(p.x*100))&0x3FFFF);
      const sy=BigInt(Math.max(0,Math.round(p.y*100))&0x3FFFF);
      const sz=BigInt(Math.max(0,Math.round(p.z*100))&0x3FFFF);
      const rot=BigInt((p.rot||0)&0x1F);
      const val=(rot<<54n)|(sz<<36n)|(sy<<18n)|sx;
      v.setUint32(ao,Number(val&0xFFFFFFFFn),true);
      v.setUint32(ao+4,Number((val>>32n)&0xFFFFFFFFn),true); ao+=8;
    }
  }
  return buf;
}

// Gzip + base64 (sans TS.slabs.pack)
async function packSlab(arrayBuffer) {
  const stream=new CompressionStream('gzip');
  const writer=stream.writable.getWriter();
  writer.write(new Uint8Array(arrayBuffer)); writer.close();
  const chunks=[], reader=stream.readable.getReader();
  while(true){const{done,value}=await reader.read(); if(done)break; chunks.push(value);}
  const total=chunks.reduce((s,c)=>s+c.length,0);
  const out=new Uint8Array(total); let off=0;
  for(const c of chunks){out.set(c,off); off+=c.length;}
  let bin=''; for(const b of out) bin+=String.fromCharCode(b);
  return btoa(bin);
}

// Decode slab — décompression native (DecompressionStream), sans TS.slabs.unpack
async function decodeSlab(code) {
  code = code.replace(/[^A-Za-z0-9+/=]/g, '');
  if (code.length < 20) throw new Error('Code trop court');

  // 1. Base64 → Uint8Array
  const binStr = atob(code);
  const compressed = Uint8Array.from(binStr, c => c.charCodeAt(0));

  // 2. Décompresser avec DecompressionStream (gzip)
  const ds = new DecompressionStream('gzip');
  const writer = ds.writable.getWriter();
  writer.write(compressed);
  writer.close();
  const chunks = [], reader = ds.readable.getReader();
  while (true) { const {done,value} = await reader.read(); if(done)break; chunks.push(value); }
  const total = chunks.reduce((s,c)=>s+c.length,0);
  const raw = new Uint8Array(total); let off=0;
  for (const c of chunks) { raw.set(c,off); off+=c.length; }

  // 3. Parser le binaire slab V2
  const buf = raw.buffer;
  const view = new DataView(buf);
  const magic = view.getUint32(0,true);
  if (magic !== 0xD1CEFACE) throw new Error('Magic invalide : 0x'+magic.toString(16));
  const nL = view.getUint16(6,true);
  let offset = 10;
  const layouts = [];
  for (let i=0;i<nL;i++) {
    layouts.push({guid:bytesToGuid(new Uint8Array(buf,offset,16)), count:view.getUint16(offset+16,true)});
    offset += 20;
  }
  const ps = [];
  for (const {guid,count} of layouts) {
    for (let i=0;i<count;i++) {
      const lo=BigInt(view.getUint32(offset,true)), hi=BigInt(view.getUint32(offset+4,true));
      offset += 8;
      const val = lo|(hi<<32n);
      ps.push({guid, x:Number(val&0x3FFFFn)/100, y:Number((val>>18n)&0x3FFFFn)/100, z:Number((val>>36n)&0x3FFFFn)/100, rot:Number((val>>54n)&0x1Fn)});
    }
  }
  return ps;
}

function bbox(ps){let x0=Infinity,z0=Infinity,x1=-Infinity,z1=-Infinity;for(const p of ps){if(p.x<x0)x0=p.x;if(p.x>x1)x1=p.x;if(p.z<z0)z0=p.z;if(p.z>z1)z1=p.z;}return{x0,z0,x1,z1};}

// A*
function astar(blocked,sx,sz,ex,ez,W,H){
  const K=(x,z)=>x*H+z,h=(x,z)=>Math.abs(x-ex)+Math.abs(z-ez);
  const open=[[h(sx,sz),0,sx,sz]],g=new Map([[K(sx,sz),0]]),prev=new Map([[K(sx,sz),null]]);
  while(open.length){
    open.sort((a,b)=>a[0]-b[0]);
    const[,gc,cx,cz]=open.shift();
    if(cx===ex&&cz===ez){const path=[];let k=K(cx,cz);while(k!==null){path.push([Math.floor(k/H),k%H]);k=prev.get(k);}return path.reverse();}
    for(const[dx,dz]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=cx+dx,nz=cz+dz;if(nx<0||nx>=W||nz<0||nz>=H)continue;
      const ng=gc+1+(blocked.has(K(nx,nz))?60:0),nk=K(nx,nz);
      if(ng<(g.get(nk)??Infinity)){g.set(nk,ng);prev.set(nk,K(cx,cz));open.push([ng+h(nx,nz),ng,nx,nz]);}
    }
  }
  return[];
}

function mkRng(seed){let s=(seed||Math.random()*0xFFFFFFFF)>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}

// Map generator — retourne {placements, separateSlabs}
async function generateMap(W,H,groundKey,buildings,seed){
  const rng=mkRng(seed),ri=(a,b)=>a+Math.floor(rng()*(b-a+1));
  const ground=GROUND[groundKey]||GROUND.herbe;
  const ps=[],occ=new Set(),K=(x,z)=>x*H+z;
  const separateSlabs=[];

  for(let x=0;x<W;x++) for(let z=0;z<H;z++) ps.push({guid:ground.guid,x,y:0,z,rot:0});

  const doors=[];
  for(const{entry,count}of buildings){
    for(let n=0;n<count;n++){
      const bw=entry.width||8,bh=entry.depth||8,mg=2;
      let slot=null;
      for(let t=0;t<400;t++){
        const tx=ri(mg,W-bw-mg),tz=ri(mg,H-bh-mg);
        let ok=true;
        for(let dx=-1;dx<bw+1&&ok;dx++) for(let dz=-1;dz<bh+1&&ok;dz++) if(occ.has(K(tx+dx,tz+dz)))ok=false;
        if(ok){slot=[tx,tz];break;}
      }
      if(!slot) continue;
      const[bx,bz]=slot;
      for(let dx=0;dx<bw;dx++) for(let dz=0;dz<bh;dz++) occ.add(K(bx+dx,bz+dz));

      let decoded=false;
      try{
        const slabPs=await decodeSlab(entry.slab_code);
        if(slabPs.length){
          const bb=bbox(slabPs);
          for(const p of slabPs) ps.push({guid:p.guid,x:p.x-bb.x0+bx,y:p.y,z:p.z-bb.z0+bz,rot:p.rot});
          decoded=true;
        }
      }catch(e){}

      if(!decoded){
        // Envoyer séparément — noter la position pour guider le joueur
        separateSlabs.push({name:entry.name, code:entry.slab_code, x:bx, z:bz});
      }
      doors.push({x:bx+Math.floor(bw/2),z:bz});
    }
  }

  if(ground.pathGuid&&doors.length>=2){
    const cells=new Set();
    for(let i=0;i<doors.length-1;i++) for(const[px,pz]of astar(occ,doors[i].x,doors[i].z,doors[i+1].x,doors[i+1].z,W,H)) cells.add(K(px,pz));
    if(doors.length>=3) for(const[px,pz]of astar(occ,doors.at(-1).x,doors.at(-1).z,doors[0].x,doors[0].z,W,H)) cells.add(K(px,pz));
    for(const k of cells){const px=Math.floor(k/H),pz=k%H;if(px>=0&&px<W&&pz>=0&&pz<H)ps.push({guid:ground.pathGuid,x:px,y:0.02,z:pz,rot:0});}
  }

  return{placements:ps, separateSlabs};
}

// Library
async function loadLibrary(){if(typeof TS==='undefined')return;try{const r=await TS.localStorage.global.getBlob();if(!r.error&&r.result)library=JSON.parse(r.result);}catch(e){}}
async function saveLibrary(){if(typeof TS==='undefined')return;try{await TS.localStorage.global.setBlob(JSON.stringify(library));}catch(e){}}

async function addSlab(){
  const name=document.getElementById('add-name').value.trim();
  const type=document.getElementById('add-type').value;
  const w=parseInt(document.getElementById('add-w').value)||8;
  const d=parseInt(document.getElementById('add-d').value)||8;
  const code=document.getElementById('add-code').value.replace(/[^A-Za-z0-9+/=]/g,'');
  if(!name) return setStatus('lib-status','❌ Donne un nom.','error');
  if(code.length<20) return setStatus('lib-status','❌ Code slab invalide.','error');
  if(library.find(e=>e.name===name)) return setStatus('lib-status','❌ Ce nom existe déjà.','error');
  library.push({name,type,slab_code:code,width:w,depth:d});
  await saveLibrary();
  document.getElementById('add-name').value='';
  document.getElementById('add-code').value='';
  renderLib(); renderPickers();
  setStatus('lib-status',`✅ « ${name} » ajouté (${w}×${d} tiles).`,'success');
}

async function removeSlab(i){
  if(!confirm(`Supprimer « ${library[i].name} » ?`))return;
  delete counts[library[i].name]; library.splice(i,1);
  await saveLibrary(); renderLib(); renderPickers();
}

function renderLib(){
  const el=document.getElementById('lib-list');
  if(!library.length){el.innerHTML='<div class="empty">Aucun slab.</div>';return;}
  el.innerHTML=library.map((e,i)=>`<div class="lib-item">
    <div class="lib-header"><span class="lib-name">${EMOJI[e.type]||'📦'} ${e.name}</span>
    <button class="btn btn-danger" onclick="removeSlab(${i})">🗑️</button></div>
    <div class="lib-meta">${e.type} · ${e.width}×${e.depth} tiles</div></div>`).join('');
}
function renderPickers(){
  const el=document.getElementById('building-pickers');
  if(!library.length){el.innerHTML='<div class="empty">Ajoute des slabs dans 📚 Bibliothèque.</div>';return;}
  for(const e of library) if(!(e.name in counts)) counts[e.name]=0;
  el.innerHTML=library.map((e,i)=>`<div class="building-item">
    <span class="building-emoji">${EMOJI[e.type]||'📦'}</span>
    <div class="building-info"><div class="building-name">${e.name}</div>
    <div class="building-size">${e.type} · ${e.width}×${e.depth}</div></div>
    <div class="counter">
      <button class="btn btn-sm" onclick="adj(${i},-1)">−</button>
      <span class="counter-val" id="cv-${i}">${counts[e.name]||0}</span>
      <button class="btn btn-sm" onclick="adj(${i},+1)">+</button>
    </div></div>`).join('');
}
function adj(i,d){const n=library[i].name;counts[n]=Math.max(0,(counts[n]||0)+d);document.getElementById('cv-'+i).textContent=counts[n];}

// Generate — étape 1 : sol
async function startGenerate(){
  const[W,H]=document.getElementById('map-size').value.split('x').map(Number);
  const groundKey=document.getElementById('map-ground').value;
  const seedRaw=document.getElementById('map-seed').value.trim();
  const seed=seedRaw?parseInt(seedRaw):null;
  const selected=library.map(e=>({entry:e,count:counts[e.name]||0})).filter(x=>x.count>0);

  pendingSlabs=[];
  document.getElementById('paste-steps').style.display='none';
  document.getElementById('steps-list').innerHTML='';

  const btn=document.getElementById('btn-gen'); btn.disabled=true;
  setStatus('gen-status','⏳ Génération en cours…','info');
  try{
    const{placements,separateSlabs}=await generateMap(W,H,groundKey,selected,seed);
    setStatus('gen-status',`🔧 Encodage de ${placements.toLocaleString()} assets…`,'info');
    const binary=buildBinary(placements);
    const slabCode=await packSlab(binary);

    if(typeof TS!=='undefined'){
      // Étape 1 : envoyer le sol
      const sent=await TS.slabs.sendSlabToHand(slabCode);
      if(sent&&sent.error) throw new Error('sendSlabToHand: '+sent.error);

      if(separateSlabs.length===0){
        setStatus('gen-status',`✅ ${placements.toLocaleString()} assets !\nSlab dans ta main — clique sur le board pour poser.`,'success');
      } else {
        // Des bâtiments doivent être collés séparément
        pendingSlabs=separateSlabs;
        setStatus('gen-status',`✅ Sol généré (${placements.toLocaleString()} assets) — pose-le d'abord.\nEnsuite colle chaque bâtiment ci-dessous.`,'success');
        renderSteps(separateSlabs, W, H);
      }
    } else {
      setStatus('gen-status','✅ Généré (hors TaleSpire).','success');
    }
  }catch(e){ setStatus('gen-status','❌ '+e.message,'error'); }
  finally{ btn.disabled=false; }
}

// Étapes de collage des bâtiments séparés
function renderSteps(slabs, W, H){
  const container=document.getElementById('paste-steps');
  const list=document.getElementById('steps-list');
  container.style.display='block';
  list.innerHTML=slabs.map((s,i)=>`
    <div class="step">
      <div class="step-title">${EMOJI[library.find(e=>e.name===s.name)?.type]||'📦'} ${s.name}</div>
      <div class="step-sub">Position approximative : colonne ${s.x}, rangée ${s.z} depuis le coin</div>
      <button class="btn step-btn" onclick="sendBuilding(${i})">📋 Envoyer ce slab à la main</button>
    </div>
  `).join('');
}

async function sendBuilding(i){
  if(typeof TS==='undefined') return;
  const s=pendingSlabs[i];
  try{
    const res=await TS.slabs.sendSlabToHand(s.code);
    if(res&&res.error) throw new Error(res.error);
    // Griser le bouton
    const btn=document.getElementById('steps-list').querySelectorAll('.step-btn')[i];
    btn.textContent='✅ Posé !'; btn.disabled=true;
  }catch(e){ alert('Erreur : '+e.message); }
}

// Init
async function handleSymbioteStateChange(evt){
  if(evt.kind==='hasInitialized'){await loadLibrary();renderLib();renderPickers();}
}
if(typeof TS==='undefined'){
  window.addEventListener('DOMContentLoaded',()=>{renderLib();renderPickers();});
}
</script>
