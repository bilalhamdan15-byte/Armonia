<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bestiaire — Armonia 🤫</title>
<style>
:root {
  --bg: #1a1a2e;
  --paper: #2a2a3e;
  --primary: #c9a85a;
  --accent: #d97c47;
  --text: #f4e8d0;
  --muted: #9a8a7a;
  --border: #3a3a4e;
  --danger: #c44040;
  --success: #5aa850;
  --info: #5a8ec9;
  --ally: #5aa850;
  --enemy: #c44040;
}
* { box-sizing: border-box; }
body {
  font-family: 'Georgia', serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 16px;
}
.container { max-width: 1200px; margin: 0 auto; }
header.title-bar {
  text-align: center;
  margin-bottom: 16px;
  padding: 18px;
  background: var(--paper);
  border: 2px solid var(--primary);
  border-radius: 8px;
}
header.title-bar h1 {
  margin: 0;
  font-size: 28px;
  color: var(--primary);
  letter-spacing: 3px;
}
header.title-bar .subtitle {
  font-style: italic;
  color: var(--muted);
  margin-top: 6px;
}
.warning-banner {
  background: var(--danger);
  color: white;
  text-align: center;
  padding: 8px;
  font-weight: bold;
  border-radius: 6px;
  margin-bottom: 16px;
  letter-spacing: 1px;
}
.search-bar {
  margin-bottom: 12px;
}
.search-bar input {
  width: 100%;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
}
.filters {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  justify-content: center;
}
.filter-btn {
  background: var(--paper);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 14px;
  border-radius: 18px;
  cursor: pointer;
  font-family: inherit;
  font-size: 13px;
}
.filter-btn:hover { border-color: var(--primary); }
.filter-btn.active {
  background: var(--primary);
  color: var(--bg);
  font-weight: bold;
  border-color: var(--primary);
}
.creature-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 14px;
}
.creature-card {
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}
.creature-card.ally { border-left: 4px solid var(--ally); }
.creature-card.enemy { border-left: 4px solid var(--enemy); }
.creature-card.neutral { border-left: 4px solid var(--info); }
.creature-card .header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 8px;
}
.creature-card h2 {
  margin: 0 0 4px 0;
  color: var(--primary);
  font-size: 19px;
}
.creature-card .creature-cat {
  color: var(--accent);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}
.threat {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
}
.threat-1 { background: #2a4a2a; color: #8aff8a; }
.threat-2 { background: #3a4a2a; color: #c4ff8a; }
.threat-3 { background: #4a4a2a; color: #ffe88a; }
.threat-4 { background: #4a3a2a; color: #ffb88a; }
.threat-5 { background: #4a2a2a; color: #ff8a8a; }
.creature-card .desc {
  font-size: 13px;
  line-height: 1.5;
  font-style: italic;
  color: #c8b890;
  margin: 8px 0;
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  margin: 10px 0;
}
.stat-box {
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 6px;
  border-radius: 4px;
  text-align: center;
}
.stat-box .label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}
.stat-box .value {
  font-size: 18px;
  font-weight: bold;
  color: var(--primary);
}
.creature-card h3 {
  color: var(--accent);
  font-size: 12px;
  margin: 12px 0 4px 0;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
  padding-bottom: 3px;
}
.attack-list, .ability-list, .loot-list {
  font-size: 13px;
  padding-left: 0;
  list-style: none;
  margin: 0;
  line-height: 1.6;
}
.attack-list li, .ability-list li, .loot-list li {
  padding: 2px 0;
}
.attack-list li::before { content: "⚔ "; color: var(--enemy); }
.ability-list li::before { content: "✨ "; color: var(--info); }
.loot-list li::before { content: "💰 "; color: var(--primary); }
.mj-notes {
  background: rgba(217, 124, 71, 0.1);
  border-left: 3px solid var(--accent);
  padding: 8px 10px;
  margin-top: 10px;
  font-size: 12px;
  font-style: italic;
  color: #f4d4a0;
  border-radius: 4px;
}
.mj-notes::before {
  content: "💡 Notes MJ : ";
  font-weight: bold;
  color: var(--accent);
}
.region-tag {
  display: inline-block;
  background: var(--bg);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  color: var(--muted);
  margin-left: 6px;
}
.named-tag {
  background: var(--primary);
  color: var(--bg);
  font-weight: bold;
}
</style>

function renderCreatures() {
  const grid = document.getElementById('creatures');
  const filter = window.currentFilter || 'all';
  const search = (document.getElementById('search').value || '').toLowerCase();
  grid.innerHTML = '';

  const filtered = CREATURES.filter(c => {
    const matchCat = filter === 'all' || c.cat === filter;
    const matchSearch = !search ||
      c.nom.toLowerCase().includes(search) ||
      c.desc.toLowerCase().includes(search) ||
      (c.region && c.region.toLowerCase().includes(search));
    return matchCat && matchSearch;
  });

  filtered.forEach(c => {
    const card = document.createElement('div');
    card.className = 'creature-card ' + c.alignment;

    const catLabels = {
      'commun': 'Monstre commun',
      'bete': 'Bête magique',
      'majeur': 'Créature majeure',
      'intelligent': 'Ennemi intelligent',
      'dragon': 'Dragon',
      'demon': 'Démon / Diable',
      'mort-vivant': 'Mort-vivant',
      'elementaire': 'Élémentaire',
      'fey': 'Fey / Petit peuple',
      'construit': 'Construct',
      'aberration': 'Aberration',
      'boss': 'Boss / Mythique',
      'pnj-allie': 'PNJ allié',
      'pnj-neutre': 'PNJ neutre'
    };

    card.innerHTML = `
      <div class="header">
        <div>
          <div class="creature-cat">${catLabels[c.cat]}</div>
          <h2>${c.nom} ${c.named ? '<span class="region-tag named-tag">★ Nommé</span>' : ''}</h2>
          ${c.region ? `<span class="region-tag">📍 ${c.region}</span>` : ''}
        </div>
        <span class="threat threat-${c.threat}">Menace ${'⭐'.repeat(c.threat)}</span>
      </div>
      <div class="desc">${c.desc}</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="label">Vitalité</div><div class="value">${c.vit}</div></div>
        <div class="stat-box"><div class="label">Défense</div><div class="value">${c.def}</div></div>
        <div class="stat-box"><div class="label">Initiative</div><div class="value">${c.init}</div></div>
      </div>
      ${c.attacks.length ? `<h3>Attaques</h3><ul class="attack-list">${c.attacks.map(a => `<li>${a}</li>`).join('')}</ul>` : ''}
      ${c.abilities.length ? `<h3>Capacités spéciales</h3><ul class="ability-list">${c.abilities.map(a => `<li>${a}</li>`).join('')}</ul>` : ''}
      ${c.loots.length ? `<h3>Loots / Trésors</h3><ul class="loot-list">${c.loots.map(l => `<li>${l}</li>`).join('')}</ul>` : ''}
      ${c.mj ? `<div class="mj-notes">${c.mj}</div>` : ''}
    `;
    grid.appendChild(card);
  });
}

function filter(cat) {
  window.currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCreatures();
}

window.currentFilter = 'all';
renderCreatures();
</script>
</body>
</html>
